<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Dzili — Ruang Belajar</title>
  <link rel="stylesheet" href="./dzili-unified.css">
</head>
<body class="dzili-body">

    import { mountDziliWorkspace } from "./dzili-app.js";
    mountDziliWorkspace(document.getElementById("dzili-root"));

      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
